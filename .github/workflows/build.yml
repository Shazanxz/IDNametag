name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar IDNameTag.asi
        shell: cmd
        run: build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: IDNameTag
          path: out/IDNameTag.asi

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/IDNameTag.asi
